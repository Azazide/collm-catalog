name: Update catalog

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Read every repository again, not only the changed ones
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # A broken generator must not publish a catalog.
      - name: Test
        run: cargo test --locked

      # Exit code 2 means the new catalog is far smaller than the last: the job fails and nothing is pushed.
      # Unchanged repositories are carried over, so a change to the rules reaches them only on a full
      # read: on request, and every Sunday.
      - name: Build the catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          flags=""
          if [ "$REFRESH" = "true" ] || [ "$(date -u +%u)" = "7" ]; then flags="--refresh"; fi
          cargo run --release --locked -- --out catalog.json $flags

      - name: Commit the change
        run: |
          if [ -z "$(git status --porcelain -- catalog.json)" ]; then
            echo "The catalog has not changed."
            exit 0
          fi
          git config user.name "collm-catalog"
          git config user.email "catalog@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update catalog"
          git push
